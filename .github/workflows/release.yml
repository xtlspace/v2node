name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build linux/amd64
        run: |
          mkdir -p build_assets
          go build -v \
            -o build_assets/v2node-linux-amd64 \
            -trimpath \
            -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=${{ inputs.version }}' -s -w -buildid="
          ls -lh build_assets/v2node-linux-amd64
          file build_assets/v2node-linux-amd64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: build_assets/v2node-linux-amd64
